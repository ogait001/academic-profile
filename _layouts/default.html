<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  {% if page.translation_url %}
  <link rel="alternate" hreflang="{{ page.lang }}" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

  {% if page.lang == "en" %}
    <link rel="alternate" hreflang="es" href="https://ogait001.github.io{{ page.translation_url }}">
  {% elsif page.lang == "es" %}
    <link rel="alternate" hreflang="en" href="https://ogait001.github.io{{ page.translation_url }}">
  {% endif %}
{% endif %} 
  {% if page.doi %}
    <meta name="citation_title" content="{{ page.title }}">
    <meta name="citation_author" content="Oscar Gaitan">
    <meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
    <meta name="citation_abstract_html_url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

    {% if page.doi %}
      <meta name="citation_doi" content="{{ page.doi }}">
    {% endif %}

    {% if page.pdf_url %}
     <meta name="citation_pdf_url" content="{{ page.pdf_url }}">
    {% endif %}

    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"ScholarlyArticle",
      "headline":"{{ page.title | escape }}",
      "author":{
        "@type":"Person",
        "name":"Oscar Gaitan"
      },
      "datePublished":"{{ page.date | date: '%Y-%m-%d' }}",
      "url":"{{ site.url }}{{ site.baseurl }}{{ page.url }}"
      {% if page.doi %},
      "identifier":"https://doi.org/{{ page.doi }}"
      {% endif %}
    }
    </script>
  {% else %}
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"Person",
      "name":"Oscar Gaitan",
      "url":"https://ogait001.github.io/academic-profile/",
      "jobTitle":"Independent Catholic Philosophical Researcher",
      "knowsAbout": [
        "Catholic theology",
        "Metaphysics",
        "Ontology",
        "Philosophy of time",
        "Phenomenology",
        "Metaphysical anthropology"
      ],
      "sameAs": [
        "https://orcid.org/0009-0007-1904-4547",
        "https://philpeople.org/profiles/oscar-gaitan",
        "https://zenodo.org/search?page=1&size=20&q=Gaitan%2C%20Oscar",
        "https://scholar.google.com/citations?user=huV-MLsAAAAJ"
      ]
    }
    </script>
  {% endif %}

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/custom.css' | relative_url }}">
</head>

<body>
    <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
</body>
</html>
