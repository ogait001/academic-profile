---
layout: default
---

{% seo %}

<meta name="citation_title" content="{{ page.title }}">
<meta name="citation_author" content="Oscar Gaitan">
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
<meta name="citation_abstract_html_url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

{% if page.doi %}
<meta name="citation_doi" content="{{ page.doi }}">
{% endif %}

{% if page.record_url %}
  <meta name="citation_public_url" content="{{ page.record_url }}">
{% endif %}

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"ScholarlyArticle",
  "headline":"{{ page.title | escape }}",
  "author":{
    "@type":"Person",
    "name":"Oscar Gaitan"
  },
  "datePublished":"{{ page.date | date: '%Y-%m-%d' }}",
  "url":"{{ site.url }}{{ site.baseurl }}{{ page.url }}"
  {% if page.doi %},
  "identifier":"https://doi.org/{{ page.doi }}"
  {% endif %}
}
</script>

<article class="post h-entry" itemscope itemtype="https://schema.org/ScholarlyArticle">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p>{{ page.date | date: "%B %d, %Y" }}</p>

    {% if page.doi %}
      <p>DOI: <a href="https://doi.org/{{ page.doi }}">{{ page.doi }}</a></p>
    {% endif %}

    {% if page.record_url %}
     <p><a href="{{ page.record_url }}">View PDF / Zenodo Record</a></p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
