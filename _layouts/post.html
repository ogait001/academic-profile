---
layout: default
---

<article class="post h-entry" itemscope itemtype="https://schema.org/ScholarlyArticle">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p>{{ page.date | date: "%B %d, %Y" }}</p>

    {% if page.doi %}
      <p>DOI: <a href="https://doi.org/{{ page.doi }}">{{ page.doi }}</a></p>
    {% endif %}

    {% if page.record_url %}
      <p><a href="{{ page.record_url }}">View PDF / Zenodo Record</a></p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
