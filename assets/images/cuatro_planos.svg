<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Los Cuatro Planos: un diagrama de lemniscata de la Topología Gaitan. El bucle continuo de la izquierda es la Temporalidad (dentro del bucle); el bucle punteado de la derecha es la Eternidad (fuera de la curva); se cruzan en el nodo central 'Yo soy el que soy', el Ahora. Recuadro superior izquierdo Temporalidad, superior derecho Eternidad, inferior izquierdo No-existencia visible, inferior derecho No-existencia eterna." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6d69b" stop-opacity="1"/>
      <stop offset="55%" stop-color="#f0c67e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e9b96a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .hdr        { font-weight: 700; font-size: 17px; }
    .hdr-sub    { font-style: italic; font-size: 13px; }
    .body       { font-size: 13.5px; }
    .body-it    { font-style: italic; font-size: 13.5px; }
    .margin-lbl { font-size: 13px; fill: #9a5a2c; }
    .curve-note { font-style: italic; font-size: 13px; fill: #7d7d7d; }
    .node-lbl   { font-weight: 700; font-size: 15px; fill: #3a2a12; letter-spacing: .02em; }
    text        { fill: #333333; }
    .center-hd  { font-size: 13.5px; }
  </style>

  <!-- ================= HEADER BOXES ================= -->
  <!-- Temporalidad (top-left) -->
  <rect x="150" y="26" width="230" height="46" rx="9" fill="#dcefe4" stroke="#9cc7ad" stroke-width="1.2"/>
  <text x="265" y="47" text-anchor="middle" class="hdr" fill="#2f6b4c">Temporalidad</text>
  <text x="265" y="63" text-anchor="middle" class="hdr-sub" fill="#2f6b4c">Dentro del bucle</text>

  <!-- Eternidad (top-right) -->
  <rect x="520" y="26" width="230" height="46" rx="9" fill="#e6e3f3" stroke="#b3aede" stroke-width="1.2"/>
  <text x="635" y="47" text-anchor="middle" class="hdr" fill="#4b3f86">Eternidad</text>
  <text x="635" y="63" text-anchor="middle" class="hdr-sub" fill="#4b3f86">Fuera de la curva</text>

  <!-- Temporalidad body -->
  <g text-anchor="middle" class="body">
    <text x="265" y="98">Lo que vemos y existe</text>
    <text x="265" y="114">(temporal)</text>
    <text x="265" y="146">Vida moral consciente</text>
    <text x="265" y="162">La conciencia diferencia</text>
    <text x="265" y="178">el bien del mal</text>
    <text x="265" y="210">Arrepentimiento posible:</text>
    <text x="265" y="226">el giro de vuelta al cruce</text>
    <text x="265" y="258">Memoria y anticipación</text>
    <text x="265" y="274">sirven a la persona en el Ahora</text>
    <text x="265" y="290">(referencia, no residencia)</text>
  </g>

  <!-- Eternidad body -->
  <g text-anchor="middle" class="body">
    <text x="635" y="98">Lo que no vemos</text>
    <text x="635" y="114">y existe eternamente</text>
    <text x="635" y="146">El presente eterno</text>
    <text x="635" y="162">El presente de Dios</text>
    <text x="635" y="194">Edén antes de la caída:</text>
    <text x="635" y="210">simplemente «ser»</text>
    <text x="635" y="242">Ninguna diferenciación necesaria</text>
    <text x="635" y="274">La existencia solo es posible</text>
    <text x="635" y="290">en el presente de Dios</text>
  </g>

  <!-- ================= LEMNISCATE ================= -->
  <line x1="70" y1="470" x2="830" y2="470" stroke="#d9d4cc" stroke-width="1"/>

  <!-- Left loop: solid (Temporalidad) -->
  <path d="M 450,470 C 300,330 150,360 150,470 C 150,580 300,610 450,470 Z"
        fill="none" stroke="#8f86c9" stroke-width="2"/>
  <path d="M 450,470 C 315,350 190,378 190,470 C 190,562 315,590 450,470 Z"
        fill="none" stroke="#b8b2dd" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- Right loop: dashed (Eternidad) -->
  <path d="M 450,470 C 600,330 750,360 750,470 C 750,580 600,610 450,470 Z"
        fill="none" stroke="#b7b1d8" stroke-width="1.6" stroke-dasharray="3 7"/>

  <!-- Central node -->
  <circle cx="450" cy="470" r="46" fill="url(#nodeGlow)"/>
  <ellipse cx="450" cy="470" rx="52" ry="15" fill="#f4d492" opacity="0.55"/>
  <text x="450" y="475" text-anchor="middle" class="node-lbl">Yo soy el que soy</text>

  <!-- "sostiene" note -->
  <text x="565" y="358" class="curve-note">sostiene</text>
  <line x1="612" y1="352" x2="486" y2="452" stroke="#cfcadf" stroke-width="1"/>

  <!-- Pasado / Futuro habitation labels -->
  <g fill="#555">
    <text x="150" y="372" class="body-it">El pasado</text>
    <text x="150" y="388" class="body">como habitación:</text>
    <text x="150" y="404" class="body">remordimiento, parálisis</text>
    <text x="150" y="420" class="body">Pura impotencia</text>
  </g>
  <g fill="#555">
    <text x="150" y="556" class="body-it">El futuro</text>
    <text x="150" y="572" class="body">como habitación:</text>
    <text x="150" y="588" class="body">ansiedad, ilusión</text>
    <text x="150" y="604" class="body">Pura irrealidad</text>
  </g>

  <!-- ================= LEFT MARGIN BRACKETS ================= -->
  <path d="M 96,330 C 78,330 78,470 96,470" fill="none" stroke="#d09a72" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="58" y="466" class="margin-lbl" text-anchor="middle">Territorio</text>
  <text x="58" y="481" class="margin-lbl" text-anchor="middle">del mal</text>

  <path d="M 96,470 C 78,470 78,1010 96,1010" fill="none" stroke="#d09a72" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="58" y="545" class="margin-lbl" text-anchor="middle">Zona</text>
  <text x="58" y="560" class="margin-lbl" text-anchor="middle">Fantasma</text>

  <!-- ================= CENTER COLUMN ================= -->
  <g text-anchor="middle" class="center-hd">
    <text x="450" y="700">Tiempo presente · El Ahora</text>
    <text x="450" y="718">El punto de cruce</text>
    <text x="450" y="736">Donde la gracia actúa</text>
    <text x="450" y="754">Donde la libertad existe</text>
    <text x="450" y="772">El mal no puede acercarse aquí</text>
  </g>
  <g text-anchor="middle">
    <text x="450" y="804" class="body-it" fill="#555">In statu gratiae:</text>
    <text x="450" y="822" class="center-hd">La Trinidad habita el cuerpo</text>
    <text x="450" y="840" class="center-hd">Dios no puede ser desplazado</text>
    <text x="450" y="858" class="center-hd">La persona debe alejarse</text>
  </g>

  <!-- Ontológico box -->
  <rect x="312" y="884" width="276" height="42" rx="7" fill="#f3f1ec" stroke="#cfc9bd" stroke-width="1"/>
  <text x="450" y="905" text-anchor="middle" class="body">Ontológico, no temporal:</text>
  <text x="450" y="920" text-anchor="middle" class="body">referencia &#8800; residencia</text>

  <!-- ================= BOTTOM BOXES ================= -->
  <!-- No-existencia visible (bottom-left) -->
  <rect x="150" y="990" width="230" height="46" rx="9" fill="#f6e3db" stroke="#e0b6a6" stroke-width="1.2"/>
  <text x="265" y="1011" text-anchor="middle" class="hdr" fill="#a15a3f">No-existencia visible</text>
  <text x="265" y="1027" text-anchor="middle" class="hdr-sub" fill="#a15a3f">Se ve pero no perdura</text>

  <g text-anchor="middle" class="body">
    <text x="265" y="1062">Maldad humana:</text>
    <text x="265" y="1078">aunque real, no</text>
    <text x="265" y="1094">existe por siempre</text>
    <text x="265" y="1126">Parásita, no autosuficiente</text>
    <text x="265" y="1142">Privatio boni</text>
  </g>
  <g text-anchor="middle" class="body-it" fill="#555">
    <text x="265" y="1170">«Mi nombre es Legión,</text>
    <text x="265" y="1186">porque somos muchos»</text>
  </g>

  <!-- No-existencia eterna (bottom-right) -->
  <rect x="520" y="990" width="230" height="46" rx="9" fill="#f6dfe4" stroke="#e0a9b8" stroke-width="1.2"/>
  <text x="635" y="1011" text-anchor="middle" class="hdr" fill="#a1466a">No-existencia eterna</text>
  <text x="635" y="1027" text-anchor="middle" class="hdr-sub" fill="#a1466a">Eres, pero no eres</text>

  <g text-anchor="middle" class="body">
    <text x="635" y="1062">El infierno es real</text>
    <text x="635" y="1094">No aniquilación sino</text>
    <text x="635" y="1110">el modo de la no-existencia</text>
  </g>
  <g text-anchor="middle" class="body-it" fill="#555">
    <text x="635" y="1142">Nunca muerto,</text>
    <text x="635" y="1158">sino eternamente muriendo</text>
    <text x="635" y="1174">— Agustín</text>
    <text x="635" y="1200">«Seréis como Dios»</text>
    <text x="635" y="1216">«No moriréis»</text>
  </g>
</svg>
