<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="The Four Planes: a lemniscate diagram of the Gaitan Topology. Left solid loop is Temporality (inside the loop); right dashed loop is Eternity (outside the curve); they cross at the central node 'I am who I am', the Now. Top-left box Temporality, top-right Eternity, bottom-left Visible non-existence, bottom-right Eternal non-existence." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6d69b" stop-opacity="1"/>
      <stop offset="55%" stop-color="#f0c67e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e9b96a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .hdr        { font-weight: 700; font-size: 17px; }
    .hdr-sub    { font-style: italic; font-size: 13px; }
    .body       { font-size: 13.5px; }
    .body-it    { font-style: italic; font-size: 13.5px; }
    .margin-lbl { font-size: 13px; fill: #9a5a2c; }
    .curve-note { font-style: italic; font-size: 13px; fill: #7d7d7d; }
    .node-lbl   { font-weight: 700; font-size: 15px; fill: #3a2a12; letter-spacing: .02em; }
    text        { fill: #333333; }
    .center-hd  { font-size: 13.5px; }
  </style>

  <!-- ================= HEADER BOXES ================= -->
  <!-- Temporality (top-left) -->
  <rect x="150" y="26" width="230" height="46" rx="9" fill="#dcefe4" stroke="#9cc7ad" stroke-width="1.2"/>
  <text x="265" y="47" text-anchor="middle" class="hdr" fill="#2f6b4c">Temporality</text>
  <text x="265" y="63" text-anchor="middle" class="hdr-sub" fill="#2f6b4c">Inside the loop</text>

  <!-- Eternity (top-right) -->
  <rect x="520" y="26" width="230" height="46" rx="9" fill="#e6e3f3" stroke="#b3aede" stroke-width="1.2"/>
  <text x="635" y="47" text-anchor="middle" class="hdr" fill="#4b3f86">Eternity</text>
  <text x="635" y="63" text-anchor="middle" class="hdr-sub" fill="#4b3f86">Outside the curve</text>

  <!-- Temporality body -->
  <g text-anchor="middle" class="body">
    <text x="265" y="98">What we see and exist</text>
    <text x="265" y="114">(temporal)</text>
    <text x="265" y="146">Conscious moral life</text>
    <text x="265" y="162">Conscience differentiates</text>
    <text x="265" y="178">good from evil</text>
    <text x="265" y="210">Repentance possible:</text>
    <text x="265" y="226">the turn back to the crossing</text>
    <text x="265" y="258">Memory and anticipation</text>
    <text x="265" y="274">serve the person at the Now</text>
    <text x="265" y="290">(reference, not residence)</text>
  </g>

  <!-- Eternity body -->
  <g text-anchor="middle" class="body">
    <text x="635" y="98">What we don't see</text>
    <text x="635" y="114">and exist eternally</text>
    <text x="635" y="146">The eternal present</text>
    <text x="635" y="162">God's present</text>
    <text x="635" y="194">Eden before the fall:</text>
    <text x="635" y="210">simply "to be"</text>
    <text x="635" y="242">No differentiation needed</text>
    <text x="635" y="274">Existence is only possible</text>
    <text x="635" y="290">in God's present</text>
  </g>

  <!-- ================= LEMNISCATE ================= -->
  <!-- horizontal axis through the node -->
  <line x1="70" y1="470" x2="830" y2="470" stroke="#d9d4cc" stroke-width="1"/>

  <!-- Left loop: solid (Temporality / the lived, temporal side) -->
  <path d="M 450,470 C 300,330 150,360 150,470 C 150,580 300,610 450,470 Z"
        fill="none" stroke="#8f86c9" stroke-width="2"/>
  <!-- Left loop inner dotted echo -->
  <path d="M 450,470 C 315,350 190,378 190,470 C 190,562 315,590 450,470 Z"
        fill="none" stroke="#b8b2dd" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- Right loop: dashed (Eternity / outside the curve) -->
  <path d="M 450,470 C 600,330 750,360 750,470 C 750,580 600,610 450,470 Z"
        fill="none" stroke="#b7b1d8" stroke-width="1.6" stroke-dasharray="3 7"/>

  <!-- Central node: I am who I am -->
  <circle cx="450" cy="470" r="46" fill="url(#nodeGlow)"/>
  <ellipse cx="450" cy="470" rx="52" ry="15" fill="#f4d492" opacity="0.55"/>
  <text x="450" y="475" text-anchor="middle" class="node-lbl">I am who I am</text>

  <!-- "sustains" note from eternity down toward the node -->
  <text x="565" y="358" class="curve-note">sustains</text>
  <line x1="612" y1="352" x2="486" y2="452" stroke="#cfcadf" stroke-width="1"/>

  <!-- Past / Future habitation labels (inside upper & lower left) -->
  <g class="body-it" fill="#555">
    <text x="150" y="372">The past</text>
    <text x="150" y="388" class="body">as habitation:</text>
    <text x="150" y="404" class="body">remorse, paralysis</text>
    <text x="150" y="420" class="body">Pure impotence</text>
  </g>
  <g class="body-it" fill="#555">
    <text x="150" y="556">The future</text>
    <text x="150" y="572" class="body">as habitation:</text>
    <text x="150" y="588" class="body">anxiety, illusion</text>
    <text x="150" y="604" class="body">Pure unreality</text>
  </g>

  <!-- ================= LEFT MARGIN BRACKETS ================= -->
  <!-- Evil's territory (upper) -->
  <path d="M 96,330 C 78,330 78,470 96,470" fill="none" stroke="#d09a72" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="60" y="466" class="margin-lbl" text-anchor="middle">Evil's</text>
  <text x="60" y="481" class="margin-lbl" text-anchor="middle">territory</text>

  <!-- Ghost zone (lower, long bracket down to Visible non-existence) -->
  <path d="M 96,470 C 78,470 78,1010 96,1010" fill="none" stroke="#d09a72" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="60" y="545" class="margin-lbl" text-anchor="middle">Ghost</text>
  <text x="60" y="560" class="margin-lbl" text-anchor="middle">zone</text>

  <!-- ================= CENTER COLUMN ================= -->
  <g text-anchor="middle" class="center-hd">
    <text x="450" y="700">Present tense - The Now</text>
    <text x="450" y="718">The crossing point</text>
    <text x="450" y="736">Where grace acts</text>
    <text x="450" y="754">Where freedom exists</text>
    <text x="450" y="772">Evil cannot approach here</text>
  </g>
  <g text-anchor="middle">
    <text x="450" y="804" class="body-it" fill="#555">In statu gratiae:</text>
    <text x="450" y="822" class="center-hd">The Trinity inhabits the body</text>
    <text x="450" y="840" class="center-hd">God cannot be displaced</text>
    <text x="450" y="858" class="center-hd">The person must walk away</text>
  </g>

  <!-- Ontological box -->
  <rect x="318" y="884" width="264" height="42" rx="7" fill="#f3f1ec" stroke="#cfc9bd" stroke-width="1"/>
  <text x="450" y="905" text-anchor="middle" class="body">Ontological, not temporal:</text>
  <text x="450" y="920" text-anchor="middle" class="body">reference &#8800; residence</text>

  <!-- ================= BOTTOM BOXES ================= -->
  <!-- Visible non-existence (bottom-left) -->
  <rect x="150" y="990" width="230" height="46" rx="9" fill="#f6e3db" stroke="#e0b6a6" stroke-width="1.2"/>
  <text x="265" y="1011" text-anchor="middle" class="hdr" fill="#a15a3f">Visible non-existence</text>
  <text x="265" y="1027" text-anchor="middle" class="hdr-sub" fill="#a15a3f">Seen but does not last</text>

  <g text-anchor="middle" class="body">
    <text x="265" y="1062">Human evilness:</text>
    <text x="265" y="1078">though real, does not</text>
    <text x="265" y="1094">exist forever</text>
    <text x="265" y="1126">Parasitic, not self-sustaining</text>
    <text x="265" y="1142">Privatio boni</text>
  </g>
  <g text-anchor="middle" class="body-it" fill="#555">
    <text x="265" y="1170">"My name is Legion,</text>
    <text x="265" y="1186">for we are many"</text>
  </g>

  <!-- Eternal non-existence (bottom-right) -->
  <rect x="520" y="990" width="230" height="46" rx="9" fill="#f6dfe4" stroke="#e0a9b8" stroke-width="1.2"/>
  <text x="635" y="1011" text-anchor="middle" class="hdr" fill="#a1466a">Eternal non-existence</text>
  <text x="635" y="1027" text-anchor="middle" class="hdr-sub" fill="#a1466a">You are, but you are not</text>

  <g text-anchor="middle" class="body">
    <text x="635" y="1062">Hell is real</text>
    <text x="635" y="1094">Not annihilation but</text>
    <text x="635" y="1110">the mode of non-existence</text>
  </g>
  <g text-anchor="middle" class="body-it" fill="#555">
    <text x="635" y="1142">Never dead,</text>
    <text x="635" y="1158">but eternally dying</text>
    <text x="635" y="1174">— Augustine</text>
    <text x="635" y="1200">"You will be like God"</text>
    <text x="635" y="1216">"You will not die"</text>
  </g>
</svg>
