<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Return to Zero: a lemniscate number line drawn in chalk on a blackboard. Zero sits at the central crossing point. Each wing sweeps outward through 1 to 5 and returns to 0, so the figure runs 0 to 5 to 0 to 5 to 0. The digits 6, 7, 8, 9 continue up each outer arm. Caption: 5 + 5 is congruent to 0, mod 10." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="chalk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.35" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="b" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="slate" cx="50%" cy="46%" r="72%">
      <stop offset="0%"  stop-color="#2f4038"/>
      <stop offset="60%" stop-color="#243530"/>
      <stop offset="100%" stop-color="#1a2723"/>
    </radialGradient>
    <radialGradient id="zeroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fffef4" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#eae2c4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#eae2c4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#eef0e6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#63756d" opacity="0.30"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="url(#slate)"/>
  <rect x="20" y="20" width="960" height="600" fill="url(#dots)"/>

  <rect x="6" y="6" width="988" height="628" rx="6" fill="none" stroke="#7a5a34" stroke-width="10"/>
  <rect x="6" y="6" width="988" height="628" rx="6" fill="none" stroke="#5b4224" stroke-width="2"/>

  <g filter="url(#chalk)">
    <path d="M500,300 C 360,150 130,175 130,300 C 130,425 360,450 500,300 C 640,150 870,175 870,300 C 870,425 640,450 500,300 Z"
          fill="none" stroke="#cfd6cb" stroke-width="6" stroke-linecap="round" opacity="0.28"/>
    <path d="M500,300 C 360,150 130,175 130,300 C 130,425 360,450 500,300 C 640,150 870,175 870,300 C 870,425 640,450 500,300 Z"
          fill="none" stroke="#f2f4ec" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <g stroke="#eef0e6" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M452,254 C 430,244 410,238 392,236" marker-end="url(#arrow)"/>
    <path d="M318,382 C 372,404 432,394 468,362" marker-end="url(#arrow)"/>
    <path d="M548,254 C 570,244 590,238 608,236" marker-end="url(#arrow)"/>
    <path d="M682,382 C 628,404 568,394 532,362" marker-end="url(#arrow)"/>
  </g>

  <ellipse cx="500" cy="300" rx="52" ry="44" fill="url(#zeroGlow)"/>
  <g filter="url(#chalk)">
    <text x="500" y="320" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
          font-size="66" font-weight="700" fill="#fdfdf5">0</text>
  </g>

  <g font-family="'Bradley Hand','Segoe Print',Georgia,serif" fill="#f4f5ee" filter="url(#chalk)">
    <text x="138" y="330" text-anchor="middle" font-size="36">5</text>
    <text x="220" y="248" text-anchor="middle" font-size="31">6</text>
    <text x="300" y="226" text-anchor="middle" font-size="31">7</text>
    <text x="372" y="220" text-anchor="middle" font-size="31">8</text>
    <text x="452" y="212" text-anchor="middle" font-size="33">9</text>
    <text x="196" y="392" text-anchor="middle" font-size="31">4</text>
    <text x="286" y="398" text-anchor="middle" font-size="31">3</text>
    <text x="356" y="396" text-anchor="middle" font-size="31">2</text>
    <text x="426" y="374" text-anchor="middle" font-size="31">1</text>

    <text x="558" y="236" text-anchor="middle" font-size="33">9</text>
    <text x="646" y="228" text-anchor="middle" font-size="31">8</text>
    <text x="730" y="230" text-anchor="middle" font-size="31">7</text>
    <text x="808" y="248" text-anchor="middle" font-size="31">6</text>
    <text x="882" y="322" text-anchor="middle" font-size="36">5</text>
    <text x="576" y="378" text-anchor="middle" font-size="31">1</text>
    <text x="660" y="400" text-anchor="middle" font-size="31">2</text>
    <text x="744" y="398" text-anchor="middle" font-size="31">3</text>
    <text x="814" y="390" text-anchor="middle" font-size="31">4</text>
  </g>

  <text x="500" y="602" text-anchor="middle" font-family="Georgia,serif" font-style="italic"
        font-size="22" fill="#dfe3d8">5 + 5 &#8801; 0 (mod 10)</text>
</svg>
